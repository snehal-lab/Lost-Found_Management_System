<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Lost & Found Report</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background: white;
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        }

        .brand {
            text-decoration: none;
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            padding: 10px 16px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: #4f46e5;
            color: white;
        }

        /* CONTAINER */

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .card-header {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-section {
            padding: 35px;
        }

        .form-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: 600;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        label span {
            color: #ef4444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .type-options {
            display: flex;
            gap: 15px;
        }

        .type-option {
            flex: 1;
        }

        .type-option input {
            display: none;
        }

        .type-label {
            display: block;
            text-align: center;
            padding: 13px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .type-option input:checked + .type-label {
            background: #eef2ff;
            border-color: #4f46e5;
            color: #4338ca;
        }

        .button-area {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 13px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-submit {
            background: #4f46e5;
            color: white;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .btn-reset {
            background: #e2e8f0;
            color: #334155;
        }

        .required-note {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 14px 20px;
            }

            .nav-links {
                width: 100%;
                flex-direction: column;
            }

            .nav-links a {
                text-align: center;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .type-options {
                flex-direction: column;
            }

            .button-area {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <nav class="navbar">

        <a href="index.html" class="brand">
            Lost & Found
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="add.html" class="active">
                Add Report
            </a>

            <a href="reports.html">
                View Reports
            </a>

            <a href="search.html">
                Search & Filter
            </a>

        </div>

    </nav>


    <div class="container">

        <div class="card">

            <div class="card-header">

                <h1>
                    Add Lost & Found Report
                </h1>

                <p>
                    Enter the details of the lost or found item
                </p>

            </div>


            <div class="form-section">

                <div class="form-title">
                    Report Details
                </div>


                <div
                    id="successMessage"
                    class="message success-message"
                >
                    Report added successfully!
                </div>


                <div
                    id="errorMessage"
                    class="message error-message"
                ></div>


                <form
                    id="reportForm"
                    action="../backend/add_report.php"
                    method="POST"
                >

                    <!-- TYPE -->

                    <div class="form-group full">

                        <label>
                            Report Type <span>*</span>
                        </label>

                        <div class="type-options">

                            <div class="type-option">

                                <input
                                    type="radio"
                                    id="lost"
                                    name="type"
                                    value="Lost"
                                    checked
                                >

                                <label
                                    for="lost"
                                    class="type-label"
                                >
                                    Lost Item
                                </label>

                            </div>


                            <div class="type-option">

                                <input
                                    type="radio"
                                    id="found"
                                    name="type"
                                    value="Found"
                                >

                                <label
                                    for="found"
                                    class="type-label"
                                >
                                    Found Item
                                </label>

                            </div>

                        </div>

                    </div>


                    <br>


                    <!-- ITEM + CATEGORY -->

                    <div class="row">

                        <div class="form-group">

                            <label for="item_name">
                                Item Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="item_name"
                                name="item_name"
                                placeholder="Enter item name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Category <span>*</span>
                            </label>

                            <select
                                id="category"
                                name="category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Documents">
                                    Documents
                                </option>

                                <option value="Bags">
                                    Bags
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Personal">
                                    Personal
                                </option>

                                <option value="Accessories">
                                    Accessories
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="row">

                        <div class="form-group full">

                            <label for="description">
                                Description
                            </label>

                            <textarea
                                id="description"
                                name="description"
                                placeholder="Enter item description"
                            ></textarea>

                        </div>

                    </div>


                    <!-- LOCATION + DATE -->

                    <div class="row">

                        <div class="form-group">

                            <label for="location">
                                Location <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="Where was it lost/found?"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="report_date">
                                Report Date <span>*</span>
                            </label>

                            <input
                                type="date"
                                id="report_date"
                                name="report_date"
                                required
                            >

                        </div>

                    </div>


                    <!-- PERSON + PHONE -->

                    <div class="row">

                        <div class="form-group">

                            <label for="person_name">
                                Person Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="person_name"
                                name="person_name"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                placeholder="Enter 10-digit phone number"
                                maxlength="10"
                                inputmode="numeric"
                                required
                            >

                        </div>

                    </div>


                    <div class="required-note">
                        * Required fields
                    </div>


                    <div class="button-area">

                        <button
                            type="reset"
                            class="btn btn-reset"
                        >
                            Clear
                        </button>

                        <button
                            type="submit"
                            class="btn btn-submit"
                        >
                            Submit Report
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <script>

        const dateInput =
            document.getElementById("report_date");

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");

        dateInput.value =
            `${year}-${month}-${day}`;


        const phoneInput =
            document.getElementById("phone");


        phoneInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

            }
        );


        const form =
            document.getElementById("reportForm");


        form.addEventListener(
            "submit",
            function (event) {

                if (
                    phoneInput.value.length !== 10
                ) {

                    event.preventDefault();

                    alert(
                        "Please enter a valid 10-digit phone number."
                    );

                    phoneInput.focus();

                }

            }
        );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        if (
            params.get("success") === "1"
        ) {

            successMessage.style.display =
                "block";

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }


        if (
            params.get("error")
        ) {

            errorMessage.textContent =
                params.get("error");

            errorMessage.style.display =
                "block";

        }

    </script>

</body>

</html>
